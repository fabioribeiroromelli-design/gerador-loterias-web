<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login VIP - Gerador de Loterias</title>
    
    <!-- Ícones e Estilos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Identity Services (GSI) SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- FIREBASE SDK (Módulos v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithCredential } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBc1Ab14Fo6Ua-u3i1SDudf4EfVijVmONY",
            authDomain: "gerador-loterias-web.firebaseapp.com",
            projectId: "gerador-loterias-web",
            storageBucket: "gerador-loterias-web.firebasestorage.app",
            messagingSenderId: "539211828205",
            appId: "1:539211828205:web:138dc9c6f09169bde2b5e4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
            } catch (e) {
                return null;
            }
        }

        // Função global para verificar o Firestore
        window.verificarAssinaturaFirestore = async function(email) {
            try {
                const cleanEmail = email.toLowerCase().trim();
                const q = query(collection(db, "usuarios"), where("email", "==", cleanEmail));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) return false;

                let eAssinante = false;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.assinante === true || data.assinante === "true") {
                        eAssinante = true;
                    }
                });
                return eAssinante;
            } catch (error) {
                console.error("Erro no Firestore:", error);
                return false;
            }
        };

        // Função global de resposta do Google
        window.handleCredentialResponse = async function(response) {
            if (!response || !response.credential) {
                alert("Erro: Nenhuma credencial recebida do Google.");
                return;
            }

            const statusEl = document.getElementById('login-status');
            if (statusEl) {
                statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verificando assinatura no sistema...';
            }

            try {
                const credential = GoogleAuthProvider.credential(response.credential);
                await signInWithCredential(auth, credential);

                const payload = parseJwt(response.credential);
                const userEmail = payload?.email;

                if (!userEmail) {
                    alert("Erro ao obter e-mail da conta Google.");
                    if (statusEl) statusEl.innerHTML = '';
                    return;
                }

                const eAssinante = await window.verificarAssinaturaFirestore(userEmail);

                const currentUser = {
                    email: userEmail,
                    name: payload.name || '',
                    picture: payload.picture || ''
                };

                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                localStorage.setItem('isSubscriber', eAssinante ? 'true' : 'false');

                if (eAssinante) {
                    alert("Sucesso! Assinatura VIP confirmada.");
                } else {
                    alert("Login realizado, mas este e-mail não possui assinatura VIP ativa.");
                }

                // Redireciona de volta para a Home
                window.location.href = "index.html";

            } catch (error) {
                console.error("Erro no login:", error);
                alert("Ocorreu um erro ao processar o login: " + error.message);
                if (statusEl) statusEl.innerHTML = '';
            }
        };

        // Inicializa o botão do Google aguardando o carregamento completo da página e do SDK
        window.addEventListener('DOMContentLoaded', () => {
            const iniciarGoogleLogin = () => {
                if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
                    google.accounts.id.initialize({
                        client_id: "383374785711-e00t37fkf9q6aqe5imqi0nnh29v2npq4.apps.googleusercontent.com",
                        callback: window.handleCredentialResponse
                    });

                    const buttonDiv = document.getElementById("buttonDiv");
                    if (buttonDiv) {
                        google.accounts.id.renderButton(
                            buttonDiv,
                            { theme: "outline", size: "large", width: 280, locale: "pt-BR" }
                        );
                    }
                } else {
                    // Se o script do Google demorar um bocadinho para injetar, tenta de novo em 100ms
                    setTimeout(iniciarGoogleLogin, 100);
                }
            };

            iniciarGoogleLogin();
        });
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .login-card h2 { color: #4a148c; margin-top: 0; }
        .login-card p { color: #666; font-size: 0.95rem; margin-bottom: 25px; }
        #buttonDiv { display: flex; justify-content: center; margin-bottom: 20px; min-height: 44px; }
        .back-link { display: inline-block; margin-top: 15px; color: #0284c7; text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { text-decoration: underline; }
        #login-status { margin-top: 15px; font-weight: bold; color: #d97706; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2><i class="fa-solid fa-lock"></i> Acesso VIP</h2>
        <p>Faça login com sua conta Google para verificar sua assinatura e liberar os recursos exclusivos.</p>
        
        <div id="buttonDiv"></div>
        <div id="login-status"></div>

        <br>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar para a Página Inicial</a>
    </div>

</body>
</html>
