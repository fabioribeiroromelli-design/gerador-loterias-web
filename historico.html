<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Oficial de Resultados</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .lottery-grid-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 25px;
        }
        .lottery-card-btn {
            border: none;
            padding: 12px 8px;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .lottery-card-btn:hover { transform: translateY(-2px); }
        .history-table-container { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); overflow-x: auto; }
        table.history-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        table.history-table th, table.history-table td { padding: 10px 12px; border-bottom: 1px solid #ddd; }
        table.history-table th { background-color: #f4f6f9; color: #333; }
        .ball { display: inline-block; background: #27ae60; color: white; width: 26px; height: 26px; line-height: 26px; border-radius: 50%; text-align: center; font-weight: bold; font-size: 12px; margin-right: 4px; }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f9;">

    <header class="header-bar" style="background: #800080; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px;">
        <button class="btn-back" onclick="window.location.href='home.html'" style="background: white; color: #800080; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">← Voltar</button>
        <h1 style="margin: 0; font-size: 1.5rem;">Histórico Oficial de Resultados</h1>
    </header>

    <main class="container" style="max-width: 1000px; margin: 30px auto; padding: 0 15px;">
        
        <!-- Seleção por Cards das 9 Loterias -->
        <div class="lottery-grid-nav">
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('megasena')" style="background: #209869;">Mega-Sena</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('lotofacil')" style="background: #930089;">Lotofácil</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('quina')" style="background: #260085;">Quina</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('lotomania')" style="background: #f78100;">Lotomania</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('timemania')" style="background: #00ff48; color: #222;">Timemania</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('duplasena')" style="background: #a61324;">Dupla Sena</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('diadesorte')" style="background: #cb831d;">Dia de Sorte</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('supersete')" style="background: #a8cf45; color: #222;">Super Sete</button>
            <button class="lottery-card-btn" onclick="carregarDadosEstaticos('maismilionaria')" style="background: #1b3582;">+Milionária</button>
        </div>

        <div id="history_display" class="history-table-container">
            <h3 id="table_title" style="margin-top: 0; margin-bottom: 15px;">Selecione uma loteria acima</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Concurso</th>
                        <th>Data</th>
                        <th>Dezenas Sorteadas</th>
                        <th>Acumulado</th>
                    </tr>
                </thead>
                <tbody id="table_body">
                    <tr><td colspan="4" style="text-align: center; color: #7f8c8d;">Nenhum dado carregado.</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // Carrega a Mega-Sena automaticamente ao abrir
        document.addEventListener('DOMContentLoaded', () => {
            carregarDadosEstaticos('megasena');
        });

        async function carregarDadosEstaticos(loteria) {
            const tbody = document.getElementById('table_body');
            const title = document.getElementById('table_title');
            
            title.textContent = `Carregando histórico de ${loteria.toUpperCase()}...`;
            tbody.innerHTML = '<tr><td colspan="4" style="text-align: center;"><i class="fa-solid fa-spinner fa-spin"></i> Lendo dados do site...</td></tr>';

            try {
                // Busca o arquivo JSON da mesma pasta local
                const response = await fetch(`./historico_${loteria}.json`);
                if (!response.ok) throw new Error('Arquivo não encontrado');
                
                const lista = await response.json();
                
                title.textContent = `Histórico: ${loteria.toUpperCase()} (${lista.length} concursos)`;
                tbody.innerHTML = '';

                lista.forEach(item => {
                    const tr = document.createElement('tr');
                    
                    let dezenasHtml = '';
                    if (Array.isArray(item.dezenas)) {
                        if (loteria.toLowerCase() === 'supersete') {
                            dezenasHtml = item.dezenas.map((d, colIdx) => `
                                <span style="display: inline-flex; flex-direction: column; align-items: center; margin-right: 6px;">
                                    <span style="font-size: 10px; color: #7f8c8d; font-weight: bold;">C${colIdx + 1}</span>
                                    <span class="ball" style="background: #a8cf45; color: #222;">${d}</span>
                                </span>
                            `).join('');
                        } else {
                            dezenasHtml = item.dezenas.map(d => `<span class="ball">${d}</span>`).join('');
                        }
                    }

                    tr.innerHTML = `
                        <td><strong>#${item.concurso}</strong></td>
                        <td>${item.dataApuracao || '-'}</td>
                        <td>${dezenasHtml}</td>
                        <td>${item.acumulado ? '<span style="color: #e74c3c; font-weight: bold;">Sim</span>' : 'Não'}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #c0392b;">Erro ao carregar <strong>historico_${loteria}.json</strong>. Verifique o arquivo.</td></tr>`;
                title.textContent = `Aviso: ${loteria.toUpperCase()}`;
            }
        }
    </script>
</body>
</html>
