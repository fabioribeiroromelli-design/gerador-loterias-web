<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar Histórico de Resultados</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="header-bar">
        <button class="btn-back" onclick="window.location.href='home.html'">← Voltar</button>
        <h1>Baixar Histórico Oficial</h1>
    </header>

    <main class="container" style="max-width: 800px; margin: 30px auto; padding: 0 15px;">
        <div style="background: #ffffff; padding: 25px; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
            <h2><i class="fa-solid fa-cloud-arrow-down"></i> Selecione a Loteria para Download</h2>
            <p style="color: #666; margin-bottom: 20px;">
                Escolha a loteria desejada para baixar o resultado mais recente diretamente da Caixa em formato JSON.
            </p>

            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px;">
                <label for="select_download_type" style="font-weight: bold;">Loteria:</label>
                <select id="select_download_type" style="padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1rem;">
                    <option value="lotofacil">Lotofácil</option>
                    <option value="megasena">Mega-Sena</option>
                    <option value="quina">Quina</option>
                    <option value="lotomania">Lotomania</option>
                    <option value="timemania">Timemania</option>
                    <option value="duplasena">Dupla Sena</option>
                    <option value="diadesorte">Dia de Sorte</option>
                    <option value="supersete">Super Sete</option>
                    <option value="maismilionaria">+Milionária</option>
                </select>

                <button id="btn_start_download" style="background: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold;">
                    <i class="fa-solid fa-download"></i> Baixar JSON
                </button>
            </div>

            <div id="download_status" style="margin-top: 15px; font-weight: bold; color: #333;"></div>
        </div>
    </main>

    <script src="download.js"></script>
</body>
</html>
