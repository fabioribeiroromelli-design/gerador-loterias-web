<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos Salvos / Saved Games / Juegos Guardados</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .grid-loterias { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        .btn-lottery { color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; transition: transform 0.1s, opacity 0.2s; }
        .btn-lottery:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-lottery.active { outline: 3px solid #222; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; }
        .section-box { background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .history-table-container { margin-top: 20px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); overflow-x: auto; }
        table.history-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        table.history-table th, table.history-table td { padding: 12px 14px; border-bottom: 1px solid #ddd; }
        table.history-table th { background-color: #f4f6f9; color: #333; }
        
        .ball { display: inline-block; background: #27ae60; color: white; width: 28px; height: 28px; line-height: 28px; border-radius: 50%; text-align: center; font-weight: bold; font-size: 12px; margin-right: 4px; }
        
        .btn-action { background: #c0392b; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .btn-action:hover { background: #a93226; }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f9;">

    <header class="header-bar" style="background: #800080; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px;">
        <button class="btn-back" onclick="window.location.href='home.html'" style="background: white; color: #800080; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">← Voltar / Back / Volver</button>
        <h1 style="margin: 0; font-size: 1.5rem;">Jogos Salvos / Saved Games / Juegos Guardados</h1>
    </header>

    <main class="container" style="max-width: 1000px; margin: 25px auto; padding: 0 15px;">
        
        <!-- SELEÇÃO RÁPIDA DA LOTERIA -->
        <div class="section-box">
            <h2 style="margin-top: 0; font-size: 1.2rem; color: #333;"><i class="fa-solid fa-gamepad"></i> Selecione a Loteria / Select Lottery / Seleccione Lotería:</h2>
            <div class="grid-loterias">
                <button class="btn-lottery" id="btn_megasena" onclick="carregarJogosSalvos('megasena')" style="background: #209869;">Mega-Sena</button>
                <button class="btn-lottery" id="btn_lotofacil" onclick="carregarJogosSalvos('lotofacil')" style="background: #930089;">Lotofácil</button>
                <button class="btn-lottery" id="btn_quina" onclick="carregarJogosSalvos('quina')" style="background: #260085;">Quina</button>
                <button class="btn-lottery" id="btn_lotomania" onclick="carregarJogosSalvos('lotomania')" style="background: #f78100;">Lotomania</button>
                <button class="btn-lottery" id="btn_timemania" onclick="carregarJogosSalvos('timemania')" style="background: #008822;">Timemania</button>
                <button class="btn-lottery" id="btn_duplasena" onclick="carregarJogosSalvos('duplasena')" style="background: #a61324;">Dupla Sena</button>
                <button class="btn-lottery" id="btn_diadesorte" onclick="carregarJogosSalvos('diadesorte')" style="background: #cb831d;">Dia de Sorte</button>
                <button class="btn-lottery" id="btn_supersete" onclick="carregarJogosSalvos('supersete')" style="background: #7ba818;">Super Sete</button>
                <button class="btn-lottery" id="btn_maismilionaria" onclick="carregarJogosSalvos('maismilionaria')" style="background: #1b3582;">+Milionária</button>
            </div>
        </div>

        <!-- TABELA DE JOGOS SALVOS -->
        <div id="history_display" class="history-table-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 id="table_title" style="margin: 0; color: #333;">Meus Jogos / My Games / Mis Juegos</h3>
            </div>
            
            <table class="history-table">
                <thead>
                    <tr>
                        <th># / ID</th>
                        <th>Data / Date / Fecha</th>
                        <th>Dezenas / Numbers / Números</th>
                        <th>Ações / Actions / Acciones</th>
                    </tr>
                </thead>
                <tbody id="table_body"></tbody>
            </table>
        </div>
    </main>

    <script>
        let loteriaAtual = 'megasena';

        function carregarJogosSalvos(loteria) {
            loteriaAtual = loteria;
            destacarBotaoAtivo(loteria);

            const tbody = document.getElementById('table_body');
            const title = document.getElementById('table_title');
            
            title.textContent = `Jogos Salvos / Saved Games: ${loteria.toUpperCase()}`;
            tbody.innerHTML = '';

            // Busca do localStorage (ou outra fonte onde seus jogos gerados são salvos)
            const chaveStorage = `jogos_${loteria}`;
            let jogos = [];
            try {
                jogos = JSON.parse(localStorage.getItem(chaveStorage)) || [];
            } catch(e) {
                jogos = [];
            }

            if (jogos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #7f8c8d;">Nenhum jogo salvo encontrado para esta loteria. / No saved games found. / No se encontraron juegos guardados.</td></tr>`;
                return;
            }

            jogos.forEach((jogo, index) => {
                const tr = document.createElement('tr');
                const dezenasHtml = Array.isArray(jogo.dezenas || jogo) 
                    ? (jogo.dezenas || jogo).map(d => `<span class="ball">${d}</span>`).join('') 
                    : '-';

                const dataJogo = jogo.data || 'N/A';

                tr.innerHTML = `
                    <td style="vertical-align: middle;"><strong>#${index + 1}</strong></td>
                    <td style="vertical-align: middle;">${dataJogo}</td>
                    <td style="vertical-align: middle;">${dezenasHtml}</td>
                    <td style="vertical-align: middle;">
                        <button class="btn-action" onclick="excluirJogo('${loteria}', ${index})">Excluir / Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function excluirJogo(loteria, index) {
            if (!confirm("Deseja realmente excluir este jogo salvo? / Do you really want to delete this saved game?")) return;
            
            const chaveStorage = `jogos_${loteria}`;
            let jogos = JSON.parse(localStorage.getItem(chaveStorage)) || [];
            
            jogos.splice(index, 1);
            localStorage.setItem(chaveStorage, JSON.stringify(jogos));
            
            carregarJogosSalvos(loteria);
        }

        function destacarBotaoAtivo(loteria) {
            document.querySelectorAll('.btn-lottery').forEach(btn => btn.classList.remove('active'));
            const btnAtivo = document.getElementById(`btn_${loteria}`);
            if (btnAtivo) btnAtivo.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', () => {
            carregarJogosSalvos('megasena');
        });
    </script>
</body>
</html>
