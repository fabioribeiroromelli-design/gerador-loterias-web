<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotofácil - Repetição</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .lotofacil-container { max-width: 900px; margin: 20px auto; padding: 0 16px; }
        .toolbar-lotofacil { background: #930089; }
        .card-analise { background: #1e1e2e; border-radius: 12px; padding: 16px; color: #e0e0e0; margin-bottom: 20px; border-left: 4px solid #930089; }
        .card-analise h3 { color: #930089; margin: 0 0 8px 0; }
        
        /* GRIDS DE COMPARATIVO */
        .grid-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 12px 0; }
        .grid-compare .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #1e1e2e; padding: 12px; border-radius: 12px; }
        
        /* QUADRADINHOS DAS DEZENAS DE 01 A 25 */
        .grid-compare .grid .ball { 
            background: #2a2a3e; 
            color: #666; 
            border-radius: 6px; 
            padding: 8px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 0.85rem; 
        }
        /* DEZENA SORTEADA */
        .grid-compare .grid .ball.sorteada { 
            background: #555; 
            color: #fff; 
        }
        /* DEZENA REPETIDA (DESTAQUE EM ROXO DA LOTOFÁCIL) */
        .grid-compare .grid .ball.repetida { 
            background: #930089; 
            color: #fff; 
            box-shadow: 0 0 8px rgba(147, 0, 137, 0.7); 
        }

        .controls { display: flex; flex-wrap: wrap; gap: 16px; background: white; padding: 16px; border-radius: 12px; margin: 16px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .controls .group { display: flex; align-items: center; gap: 8px; }
        .controls .group label { font-weight: 600; font-size: 0.85rem; color: #333; }
        .controls .group input[type="number"] { width: 50px; padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; text-align: center; background: #f8f8f8; }
        .controls .group button { background: #930089; color: white; border: none; border-radius: 4px; padding: 4px 10px; font-weight: bold; cursor: pointer; }
        .controls .group button:hover { opacity: 0.8; }
        .btn-gerar { background: #930089; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: bold; font-size: 1rem; cursor: pointer; margin: 8px 0; width: 100%; }
        .btn-gerar:hover { opacity: 0.85; }
        .game-card { background: #1e1e2e; border-radius: 12px; padding: 12px; margin-bottom: 12px; border-left: 4px solid #930089; }
        .game-card .header { display: flex; justify-content: space-between; align-items: center; }
        .game-card .header .title { color: #930089; font-weight: bold; }
        .game-card .dezenas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 8px 0; }
        .game-card .dezenas span { background: #930089; color: white; border-radius: 6px; padding: 6px 0; text-align: center; font-weight: bold; font-size: 0.85rem; }
        .game-card .info { font-size: 0.75rem; color: #aaa; }
        .game-card .actions { display: flex; gap: 8px; margin-top: 6px; }
        .game-card .actions button { background: #3DD68C; border: none; color: white; padding: 4px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
        .game-card .actions button:hover { opacity: 0.8; }
        .game-card .actions button.ver { background: #3B82F6; }
        .btn-salvar-todos { background: #3DD68C; color: white; border: none; padding: 10px; border-radius: 40px; font-weight: bold; width: 100%; margin: 12px 0; cursor: pointer; }
        .btn-salvar-todos:hover { opacity: 0.85; }
        #progress { display: none; text-align: center; padding: 20px; }
        
        @media (max-width: 600px) {
            .grid-compare { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="toolbar toolbar-lotofacil">
        <h1><i class="fa-solid fa-rotate" style="color: #FFD700;"></i> Lotofácil - Repetição</h1>
        <button onclick="window.location.href='home.html'" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">
            <i class="fa-solid fa-arrow-left"></i> Voltar
        </button>
    </header>

    <div class="lotofacil-container">
        <div id="analise" class="card-analise">
            <h3><i class="fa-solid fa-chart-line"></i> Análise</h3>
            <div id="analise-texto">Carregando...</div>
        </div>

        <div id="comparativo" style="display: none;">
            <h4 style="color: #930089; margin-bottom: 8px;">Comparativo Últimos Concursos</h4>
            <div class="grid-compare">
                <div>
                    <p style="font-weight: bold; color: #aaa; margin-bottom: 6px;" id="titulo-anterior">Anterior</p>
                    <div id="grid-anterior" class="grid"></div>
                </div>
                <div>
                    <p style="font-weight: bold; color: #930089; margin-bottom: 6px;" id="titulo-ultimo">Último</p>
                    <div id="grid-ultimo" class="grid"></div>
                </div>
            </div>
            <div id="stats-ultimo" style="font-size:0.8rem; color: #aaa; margin-top: 8px; text-align: center;"></div>
        </div>

        <div class="controls">
            <div class="group">
                <label>Dezenas:</label>
                <button id="dec-men">-</button>
                <input type="number" id="qtd-dezenas" value="15" min="15" max="20">
                <button id="dec-mais">+</button>
            </div>
            <div class="group">
                <label>Repetidas:</label>
                <button id="rep-men">-</button>
                <input type="number" id="qtd-repetidas" value="9" min="5" max="15">
                <button id="rep-mais">+</button>
            </div>
            <div class="group">
                <label>Jogos:</label>
                <button id="jog-men">-</button>
                <input type="number" id="qtd-jogos" value="10" min="1" max="100">
                <button id="jog-mais">+</button>
            </div>
            <div class="group">
                <label>Pares:</label>
                <input type="number" id="filter-pares" placeholder="ex: 8" style="width:50px;">
            </div>
            <div class="group">
                <label>Ímpares:</label>
                <input type="number" id="filter-impares" placeholder="ex: 7" style="width:50px;">
            </div>
            <div class="group">
                <label>Primos:</label>
                <input type="number" id="filter-primos" placeholder="ex: 6" style="width:50px;">
            </div>
        </div>

        <button id="btn-gerar" class="btn-gerar"><i class="fa-solid fa-bolt"></i> Gerar Jogos</button>
        <div id="progress"><i class="fa-solid fa-spinner fa-spin"></i> Gerando...</div>

        <div id="resultados">
            <button id="btn-salvar-todos" class="btn-salvar-todos" style="display:none;"><i class="fa-solid fa-save"></i> Salvar Todos</button>
            <div id="container-jogos"></div>
        </div>
    </div>

    <!-- 1. Carrega o banco de dados dos concursos antes do script de execução -->
    <script src="historico_lotofacil.js"></script>
    
    <!-- 2. Executa a lógica comparativa do script -->
    <script src="lotofacil-repeticao.js"></script>
</body>
</html>
