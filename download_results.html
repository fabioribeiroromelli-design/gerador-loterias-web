<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads de Resultados</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1b365d;
            margin-bottom: 20px;
        }
        .lottery-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }
        .lottery-item:hover {
            background-color: #f8fafc;
        }
        .lottery-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .lottery-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
        }
        .lottery-details {
            font-size: 0.85rem;
            color: #64748b;
        }
        .dezenas-container {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .dezena-tag {
            background: #2563eb;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 12px;
        }
        .btn-download {
            background-color: #209869;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #15803d;
        }
        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-file-arrow-down"></i> Resultados e Downloads</h1>
    <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Carregando resultados...</div>
    <div id="results_list"></div>
</div>

<script>
window.downloadResultado = function(nome, concurso, dataApuracao, dezenasStr) {
    const conteudo = `=====================================\nRESULTADO: ${nome.toUpperCase()}\nCONCURSO: ${concurso}\nDATA: ${dataApuracao}\nDEZENAS: ${dezenasStr}\n=====================================`;
    const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${nome.toLowerCase().replace(/\s+/g, '_')}_${concurso}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
};

document.addEventListener('DOMContentLoaded', async () => {
    const listContainer = document.getElementById('results_list');
    const loadingContainer = document.getElementById('loading');

    // Mapeia para os nomes exatos dos arquivos JSON do seu repositório
    const LOTERIAS = {
        'Dia de Sorte': 'historico_diadesorte.json',
        'Dupla Sena': 'historico_duplasena.json',
        'Lotofácil': 'historico_lotofacil.json',
        'Lotomania': 'historico_lotomania.json',
        '+Milionária': 'historico_maismilionaria.json',
        'Mega-Sena': 'historico_megasena.json',
        'Quina': 'historico_quina.json',
        'Super Sete': 'historico_supersete.json',
        'Timemania': 'historico_timemania.json'
    };

    let html = '';
    const cacheBuster = new Date().getTime();

    for (const [nome, arquivoJson] of Object.entries(LOTERIAS)) {
        let itemData = null;

        try {
            const res = await fetch(`./${arquivoJson}?v=${cacheBuster}`);
            if (res.ok) {
                const dados = await res.json();
                const ultimo = Array.isArray(dados) ? dados[dados.length - 1] : dados;

                if (ultimo) {
                    itemData = {
                        concurso: ultimo.concurso || ultimo.numero || '--',
                        data: ultimo.dataApuracao || ultimo.data || '--',
                        dezenas: ultimo.dezenas || ultimo.listaDezenas || []
                    };
                }
            }
        } catch (err) {
            console.error(`Erro ao ler ${arquivoJson}:`, err);
        }

        if (itemData) {
            const dezenasArr = Array.isArray(itemData.dezenas) ? itemData.dezenas : [];
            const dezenasTexto = dezenasArr.join(' - ');
            const tagsHtml = dezenasArr.map(d => `<span class="dezena-tag">${String(d).padStart(2, '0')}</span>`).join('');

            html += `
                <div class="lottery-item">
                    <div class="lottery-info">
                        <span class="lottery-name">${nome}</span>
                        <span class="lottery-details">Concurso: <strong>${itemData.concurso}</strong> | Data: <strong>${itemData.data}</strong></span>
                        <div class="dezenas-container">${tagsHtml || '<em>Sem dezenas</em>'}</div>
                    </div>
                    <button class="btn-download" onclick="downloadResultado('${nome}', '${itemData.concurso}', '${itemData.data}', '${dezenasTexto}')">
                        <i class="fa-solid fa-download"></i> Baixar TXT
                    </button>
                </div>
            `;
        } else {
            html += `
                <div class="lottery-item">
                    <div class="lottery-info">
                        <span class="lottery-name">${nome}</span>
                        <span class="lottery-details" style="color:#ef4444;">Dados não encontrados.</span>
                    </div>
                </div>
            `;
        }
    }

    loadingContainer.style.display = 'none';
    listContainer.innerHTML = html;
});
</script>

</body>
</html>
