<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Resultados - Automático</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .grid-loterias { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 15px; }
        .btn-lottery { color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; transition: transform 0.1s, opacity 0.2s; }
        .btn-lottery:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-lottery.active { outline: 3px solid #222; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; }
        .section-box { background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; box-shadow: 0 2px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .history-table-container { margin-top: 20px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); overflow-x: auto; }
        table.history-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        table.history-table th, table.history-table td { padding: 10px 12px; border-bottom: 1px solid #ddd; }
        table.history-table th { background-color: #f4f6f9; color: #333; }
        
        .ball { display: inline-block; background: #27ae60; color: white; width: 26px; height: 26px; line-height: 26px; border-radius: 50%; text-align: center; font-weight: bold; font-size: 12px; margin-right: 4px; }
        .badge-extra { display: inline-block; margin-top: 4px; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        /* Botão de Download */
        .btn-download { background: #27ae60; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .btn-download:hover { background: #219150; }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f9;">

    <header class="header-bar" style="background: #800080; color: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px;">
        <button class="btn-back" onclick="window.location.href='home.html'" style="background: white; color: #800080; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold;">← Voltar</button>
        <h1 style="margin: 0; font-size: 1.5rem;">Histórico das Loterias</h1>
    </header>

    <main class="container" style="max-width: 1000px; margin: 25px auto; padding: 0 15px;">
        
        <!-- SELEÇÃO RÁPIDA DA LOTERIA -->
        <div class="section-box">
            <h2 style="margin-top: 0; font-size: 1.2rem; color: #333;"><i class="fa-solid fa-gamepad"></i> Selecione a Loteria para Visualizar:</h2>
            <div class="grid-loterias">
                <button class="btn-lottery" id="btn_megasena" onclick="carregarLoteria('megasena')" style="background: #209869;">Mega-Sena</button>
                <button class="btn-lottery" id="btn_lotofacil" onclick="carregarLoteria('lotofacil')" style="background: #930089;">Lotofácil</button>
                <button class="btn-lottery" id="btn_quina" onclick="carregarLoteria('quina')" style="background: #260085;">Quina</button>
                <button class="btn-lottery" id="btn_lotomania" onclick="carregarLoteria('lotomania')" style="background: #f78100;">Lotomania</button>
                <button class="btn-lottery" id="btn_timemania" onclick="carregarLoteria('timemania')" style="background: #008822;">Timemania</button>
                <button class="btn-lottery" id="btn_duplasena" onclick="carregarLoteria('duplasena')" style="background: #a61324;">Dupla Sena</button>
                <button class="btn-lottery" id="btn_diadesorte" onclick="carregarLoteria('diadesorte')" style="background: #cb831d;">Dia de Sorte</button>
                <button class="btn-lottery" id="btn_supersete" onclick="carregarLoteria('supersete')" style="background: #7ba818;">Super Sete</button>
                <button class="btn-lottery" id="btn_maismilionaria" onclick="carregarLoteria('maismilionaria')" style="background: #1b3582;">+Milionária</button>
            </div>

            <div id="status_msg" class="status-box" style="display: none;"></div>
        </div>

        <!-- TABELA DE RESULTADOS -->
        <div id="history_display" class="history-table-container" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                <h3 id="table_title" style="margin: 0; color: #333;">Resultados</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="badge_origem" style="background: #28a745; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold;">Arquivo Local Carregado</span>
                    <button class="btn-download" onclick="baixarArquivoJs()"><i class="fa-solid fa-download"></i> Baixar Arquivo JS</button>
                </div>
            </div>
            
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Concurso</th>
                        <th>Data</th>
                        <th>Dezenas / Sorteio</th>
                        <th>Acumulado</th>
                    </tr>
                </thead>
                <tbody id="table_body"></tbody>
            </table>
        </div>
    </main>

    <script>
        let loteriaAtual = 'megasena';
        let dadosAtuais = [];

        window.addEventListener('DOMContentLoaded', () => {
            carregarLoteria('megasena');
        });

        async function carregarLoteria(loteria) {
            loteriaAtual = loteria;
            destacarBotaoAtivo(loteria);

            const statusEl = document.getElementById('status_msg');
            statusEl.style.display = 'block';
            statusEl.style.background = '#e8f4fd';
            statusEl.style.color = '#0056b3';
            statusEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Lendo dados da loteria...`;

            // Tenta 1: Verifica se já existe salvo na memória (localStorage)
            const salvosMemoria = localStorage.getItem(`historico_${loteria}`) || localStorage.getItem(loteria.toUpperCase());
            if (salvosMemoria) {
                try {
                    dadosAtuais = JSON.parse(salvosMemoria);
                    exibirDadosNaTabela(loteria, dadosAtuais, 'Memória / Local');
                    statusEl.style.display = 'none';
                    return;
                } catch (e) {
                    console.warn('Erro ao ler memória local:', e);
                }
            }

            // Tenta 2: Lê o arquivo JSON direto da pasta do projeto
            try {
                const response = await fetch(`./historico_${loteria}.json`);
                if (!response.ok) throw new Error('Arquivo não encontrado na pasta');

                dadosAtuais = await response.json();
                
                localStorage.setItem(`historico_${loteria}`, JSON.stringify(dadosAtuais));
                
                exibirDadosNaTabela(loteria, dadosAtuais, 'Arquivo JSON da Pasta');
                statusEl.style.display = 'none';

            } catch (err) {
                console.error(err);
                statusEl.style.background = '#fff3cd';
                statusEl.style.color = '#856404';
                statusEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> O arquivo <strong>historico_${loteria}.json</strong> não foi encontrado na pasta ou a página precisa ser aberta via servidor local (Live Server).`;
                document.getElementById('history_display').style.display = 'none';
            }
        }

        function destacarBotaoAtivo(loteria) {
            document.querySelectorAll('.btn-lottery').forEach(btn => btn.classList.remove('active'));
            const btnAtivo = document.getElementById(`btn_${loteria}`);
            if (btnAtivo) btnAtivo.classList.add('active');
        }

        function exibirDadosNaTabela(loteria, lista, fonte) {
            const container = document.getElementById('history_display');
            const tbody = document.getElementById('table_body');
            const title = document.getElementById('table_title');
            const badge = document.getElementById('badge_origem');

            title.textContent = `Histórico: ${loteria.toUpperCase()} (${lista.length} concursos carregados)`;
            badge.textContent = `Origem: ${fonte}`;
            tbody.innerHTML = '';

            lista.forEach(item => {
                const tr = document.createElement('tr');
                
                let dezenasHtml = '';
                if (Array.isArray(item.dezenas)) {
                    if (loteria.toLowerCase() === 'supersete') {
                        dezenasHtml = item.dezenas.map((d, colIdx) => `
                            <span style="display: inline-flex; flex-direction: column; align-items: center; margin-right: 6px;">
                                <span style="font-size: 10px; color: #7f8c8d; font-weight: bold;">C${colIdx + 1}</span>
                                <span class="ball" style="background: #a8cf45; color: #222;">${d}</span>
                            </span>
                        `).join('');
                    } else {
                        dezenasHtml = item.dezenas.map(d => `<span class="ball">${d}</span>`).join('');
                    }
                }

                let extrasHtml = '';
                if (loteria === 'diadesorte' && item.mesSorte) {
                    extrasHtml = `<br><span class="badge-extra" style="background: #fff3cd; color: #856404; border: 1px solid #ffeeba;">🗓️ Mês da Sorte: <strong>${item.mesSorte}</strong></span>`;
                } else if (loteria === 'timemania' && item.timeCoracao) {
                    extrasHtml = `<br><span class="badge-extra" style="background: #d4edda; color: #155724; border: 1px solid #c3e6cb;">⚽ Time do Coração: <strong>${item.timeCoracao}</strong></span>`;
                } else if (loteria === 'maismilionaria' && item.trevos && item.trevos.length > 0) {
                    const trevosTxt = Array.isArray(item.trevos) ? item.trevos.join(', ') : item.trevos;
                    extrasHtml = `<br><span class="badge-extra" style="background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb;">🍀 Trevos: <strong>${trevosTxt}</strong></span>`;
                }

                tr.innerHTML = `
                    <td><strong>#${item.concurso}</strong></td>
                    <td>${item.dataApuracao || '-'}</td>
                    <td><div>${dezenasHtml}</div>${extrasHtml}</td>
                    <td>${item.acumulado ? '<span style="color: #e74c3c; font-weight: bold;">Sim</span>' : 'Não'}</td>
                `;
                tbody.appendChild(tr);
            });

            container.style.display = 'block';
        }

        // Função para gerar e baixar o arquivo .js corrigido
        function baixarArquivoJs() {
            if (!dadosAtuais || dadosAtuais.length === 0) {
                alert('Nenhum dado encontrado para exportar!');
                return;
            }

            const varName = `HISTORICO_${loteriaAtual.toUpperCase()}`;
            const conteudo = `const ${varName} = ${JSON.stringify(dadosAtuais, null, 2)};\n`;

            const blob = new Blob([conteudo], { type: 'application/javascript;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = `historico_${loteriaAtual}.js`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
