<!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuração apontando para o projeto "Gerador de Jogos" (gerador-de-jogos-5e787)
        const firebaseConfig = {
            projectId: "gerador-de-jogos-5e787"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let loteriaAtual = 'megasena';

        const syncEl = document.getElementById('sync_status');

        // ============================================================
        // CARREGAR LOTERIA (só leitura de historico_loterias/{id})
        // ============================================================
        window.carregarLoteria = async function(loteria) {
            loteriaAtual = loteria;
            destacarBotaoAtivo(loteria);

            // Reset UI
            document.getElementById('loading_box').style.display = 'block';
            document.getElementById('history_display').style.display = 'none';
            document.getElementById('stats_box').style.display = 'none';
            document.getElementById('loading_box').innerHTML = `
                <div class="loading">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    Carregando ${loteria.toUpperCase()}...
                </div>`;

            syncEl.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Carregando...`;

            try {
                const docRef = doc(db, 'historico_loterias', loteria);
                const snap = await getDoc(docRef);

                if (!snap.exists()) {
                    mostrarVazio(loteria);
                    return;
                }

                const dados = snap.data();
                const concursos = dados.concursos || [];

                if (concursos.length === 0) {
                    mostrarVazio(loteria);
                    return;
                }

                // Renderiza
                mostrarEstatisticas(loteria, concursos, dados);
                exibirDadosNaTabela(loteria, concursos);

                document.getElementById('loading_box').style.display = 'none';
                document.getElementById('history_display').style.display = 'block';
                document.getElementById('stats_box').style.display = 'block';

                syncEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${concursos.length} concursos`;
            } catch (err) {
                console.error("Erro:", err);
                syncEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Erro`;
                document.getElementById('loading_box').innerHTML = `
                    <div class="empty">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <strong>Erro ao carregar</strong><br>
                        <small>${err.message}</small>
                    </div>`;
            }
        };

        // ============================================================
        // ESTATÍSTICAS
        // ============================================================
        function mostrarEstatisticas(loteria, concursos, meta) {
            const ordenado = [...concursos].sort((a, b) =>
                Number(b.concurso) - Number(a.concurso)
            );
            const ultimo = ordenado[0];
            const acumulados = ordenado.filter(c => c.acumulado).length;

            document.getElementById('stat_total').textContent = concursos.length.toLocaleString('pt-BR');
            document.getElementById('stat_ultimo').textContent = ultimo ? '#' + ultimo.concurso : '--';
            document.getElementById('stat_data').textContent = ultimo ? (ultimo.data || '--') : '--';
            document.getElementById('stat_acumulados').textContent = acumulados.toLocaleString('pt-BR');

            document.getElementById('table_title').innerHTML =
                `<i class="fa-solid fa-table"></i> ${loteria.toUpperCase()} — ${concursos.length} concursos`;
        }

        // ============================================================
        // ESTADO VAZIO
        // ============================================================
        function mostrarVazio(loteria) {
            document.getElementById('loading_box').innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-folder-open"></i>
                    <strong>Sem histórico para ${loteria.toUpperCase()}</strong><br>
                    <small>O robô ainda não baixou esta loteria. Rode o workflow novamente.</small>
                </div>`;
            syncEl.innerHTML = `<i class="fa-solid fa-circle-info"></i> Sem dados`;
        }

        // ============================================================
        // RENDERIZAR TABELA
        // ============================================================
        function exibirDadosNaTabela(loteria, lista) {
            const tbody = document.getElementById('table_body');
            const ordenado = [...lista].sort((a, b) =>
                Number(b.concurso) - Number(a.concurso)
            );

            tbody.innerHTML = '';

            // Limita a 200 últimos pra não travar o navegador
            const LIMITE = 200;
            const mostrar = ordenado.slice(0, LIMITE);

            mostrar.forEach(item => {
                const tr = document.createElement('tr');
                let dezenasHtml = '';

                if (Array.isArray(item.dezenas)) {
                    if (loteria === 'supersete') {
                        dezenasHtml = item.dezenas.map((d, i) => `
                            <span style="display:inline-flex;flex-direction:column;align-items:center;margin-right:5px;">
                                <span style="font-size:9px;color:#64748b;font-weight:bold;">C${i+1}</span>
                                <span class="ball ball-supersete">${d}</span>
                            </span>`).join('');
                    } else {
                        dezenasHtml = item.dezenas.map(d => `<span class="ball">${d}</span>`).join('');
                    }
                }

                // Extras
                let extras = '';

                if (loteria === 'diadesorte' && (item.mesSorte || item.nomeTimeCoracaoMesSorte)) {
                    const mes = item.mesSorte || item.nomeTimeCoracaoMesSorte;
                    extras += `<br><span class="badge-extra" style="background:#fff3cd;color:#856404;">🗓️ Mês: <strong>${mes}</strong></span>`;
                }
                if (loteria === 'timemania' && (item.timeCoracao || item.nomeTimeCoracaoMesSorte)) {
                    const time = item.timeCoracao || item.nomeTimeCoracaoMesSorte;
                    extras += `<br><span class="badge-extra" style="background:#d4edda;color:#155724;">⚽ Time: <strong>${time}</strong></span>`;
                }
                if (loteria === 'maismilionaria' && item.trevos && item.trevos.length > 0) {
                    const bolasTrevo = item.trevos.map(t => `<span class="ball ball-trevo">★${t}</span>`).join('');
                    extras += `<br><span class="badge-extra" style="background:#d1ecf1;color:#0c5460;">🍀 Trevos: ${bolasTrevo}</span>`;
                }
                if (loteria === 'duplasena' && item.dezenasSorteio2 && item.dezenasSorteio2.length > 0) {
                    const bolas2 = item.dezenasSorteio2.map(d => `<span class="ball ball-dupla2">${d}</span>`).join('');
                    extras += `<br><span class="badge-extra" style="background:#f3e5f5;color:#4a148c;">2º Sorteio: ${bolas2}</span>`;
                }

                const txtAcumulado = item.acumulado
                    ? '<span style="color:#e74c3c; font-weight:bold;">Sim</span>'
                    : '<span style="color:#64748b;">Não</span>';

                tr.innerHTML = `
                    <td><strong>#${item.concurso}</strong></td>
                    <td>${item.data || '-'}</td>
                    <td><div>${dezenasHtml}</div>${extras}</td>
                    <td>${txtAcumulado}</td>
                `;
                tbody.appendChild(tr);
            });

            // Aviso se truncou
            if (ordenado.length > LIMITE) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="4" style="text-align:center;color:#64748b;font-style:italic;padding:12px;">
                    Mostrando os ${LIMITE} concursos mais recentes de ${ordenado.length} total.
                </td>`;
                tbody.appendChild(tr);
            }
        }

        function destacarBotaoAtivo(loteria) {
            document.querySelectorAll('.btn-lottery').forEach(b => b.classList.remove('active'));
            const b = document.getElementById(`btn_${loteria}`);
            if (b) b.classList.add('active');
        }

        // Carrega Mega-Sena por padrão
        window.addEventListener('DOMContentLoaded', () => {
            window.carregarLoteria('megasena');
        });
    </script>
