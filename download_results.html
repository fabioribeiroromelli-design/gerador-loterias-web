<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads de Resultados</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDKs (Versão Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Seu arquivo de configuração do Firebase -->
    <script src="firebase-config.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #1b365d;
            margin-bottom: 20px;
        }
        .lottery-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }
        .lottery-item:hover {
            background-color: #f8fafc;
        }
        .lottery-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .lottery-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
        }
        .lottery-details {
            font-size: 0.85rem;
            color: #64748b;
        }
        .dezenas-container {
            margin-top: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .dezena-tag {
            background: #2563eb;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 12px;
        }
        .btn-download {
            background-color: #209869;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-download:hover {
            background-color: #15803d;
        }
        #loading {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1><i class="fa-solid fa-file-arrow-down"></i> Resultados e Downloads</h1>
    <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Carregando resultados...</div>
    <div id="results_list"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const listContainer = document.getElementById('results_list');
    const loadingContainer = document.getElementById('loading');

    const DOC_IDS = {
        'Dia de Sorte': 'diadesorte',
        'Dupla Sena': 'duplasena',
        'Federal': 'federal',
        'Loteca': 'loteca',
        'Lotofácil': 'lotofacil',
        'Lotomania': 'lotomania',
        '+Milionária': 'maismilionaria',
        'Mega-Sena': 'megasena',
        'Quina': 'quina',
        'Super Sete': 'supersete',
        'Timemania': 'timemania'
    };

    // Mapeamento dinâmico para evitar erros de campo nulo do Firestore
    function MapearDados(docData) {
        if (!docData) return null;
        return {
            concurso: docData.concurso || docData.numero || '--',
            data: docData.dataApuracao || docData.data || '--',
            dezenas: docData.dezenas || docData.listaDezenas || []
        };
    }

    // Função para baixar o resultado em formato TXT
    window.downloadResultado = function(nome, concurso, dataApuracao, dezenasStr) {
        const conteudo = `=====================================\nRESULTADO: ${nome.toUpperCase()}\nCONCURSO: ${concurso}\nDATA: ${dataApuracao}\nDEZENAS: ${dezenasStr}\n=====================================`;
        const blob = new Blob([conteudo], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${nome.toLowerCase().replace(/\s+/g, '_')}_${concurso}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    };

    try {
        let html = '';
        for (const [nome, docId] of Object.entries(DOC_IDS)) {
            let itemData = null;
            
            try {
                const docSnap = await db.collection('loterias').doc(docId).get();
                if (docSnap.exists) {
                    itemData = MapearDados(docSnap.data());
                }
            } catch (err) {
                console.error(`Erro ao carregar ${nome}:`, err);
            }

            if (itemData) {
                const dezenasArr = Array.isArray(itemData.dezenas) ? itemData.dezenas : [];
                const dezenasTexto = dezenasArr.join(' - ');
                const tagsHtml = dezenasArr.map(d => `<span class="dezena-tag">${String(d).padStart(2, '0')}</span>`).join('');

                html += `
                    <div class="lottery-item">
                        <div class="lottery-info">
                            <span class="lottery-name">${nome}</span>
                            <span class="lottery-details">Concurso: <strong>${itemData.concurso}</strong> | Data: <strong>${itemData.data}</strong></span>
                            <div class="dezenas-container">${tagsHtml || '<em>Sem dezenas disponíveis</em>'}</div>
                        </div>
                        <button class="btn-download" onclick="downloadResultado('${nome}', '${itemData.concurso}', '${itemData.data}', '${dezenasTexto}')">
                            <i class="fa-solid fa-download"></i> Baixar TXT
                        </button>
                    </div>
                `;
            } else {
                html += `
                    <div class="lottery-item">
                        <div class="lottery-info">
                            <span class="lottery-name">${nome}</span>
                            <span class="lottery-details" style="color:#ef4444;">Dados indisponíveis no momento.</span>
                        </div>
                    </div>
                `;
            }
        }

        loadingContainer.style.display = 'none';
        listContainer.innerHTML = html;

    } catch (e) {
        console.error("Erro geral na renderização:", e);
        loadingContainer.innerHTML = `<span style="color:#dc2626;">Erro ao carregar os dados. Verifique a conexão com o Firebase.</span>`;
    }
});
</script>

</body>
</html>
