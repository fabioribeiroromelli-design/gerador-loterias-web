name: Atualizar Loterias Automaticamente

on:
  schedule:
    # Roda todo dia às 08:00 UTC (05:00 da manhã no Horário de Brasília)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub sempre que quiser

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install firebase-admin

      - name: Baixar novos resultados e atualizar arquivos e Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node atualizar.js

      - name: Fazer commit e push dos dados atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: Atualização automática dos dados das loterias" && git push origin master)
