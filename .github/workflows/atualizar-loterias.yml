name: Atualizar Loterias Automaticamente

on:
  schedule:
    # Roda todo dia às 03:00 da manhã (horário UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite que você clique em "Run workflow" manualmente quando quiser

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Baixar novos resultados e atualizar arquivos JSON
        run: |
          node -e '
          const fs = require("fs");
          const https = require("https");

          const loterias = ["megasena", "lotofacil", "quina", "lotomania", "timemania", "duplasena", "diadesorte", "supersete", "maismilionaria"];

          if (!fs.existsSync("dados")) {
              fs.mkdirSync("dados");
          }

          async function baixarDados() {
              for (const loteria of loterias) {
                  const url = `https://loteriascaixa-api.herokuapp.com/api/${loteria}`;
                  await new Promise((resolve) => {
                      https.get(url, (res) => {
                          let data = "";
                          res.on("data", (chunk) => { data += chunk; });
                          res.on("end", () => {
                              try {
                                  const json = JSON.parse(data);
                                  // Inverte para manter o histórico em ordem cronológica correta (antigo -> recente)
                                  const historico = Array.isArray(json) ? json.reverse() : json;
                                  fs.writeFileSync(`dados/${loteria}.json`, JSON.stringify(historico));
                                  console.log(`Sucesso ao atualizar: ${loteria}`);
                              } catch (e) {
                                  console.log(`Erro ao processar ${loteria}:`, e.message);
                              }
                              resolve();
                          });
                      }).on("error", () => resolve());
                  });
              }
          }
          baixarDados();
          '

      - name: Enviar alterações atualizadas de volta para o GitHub
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add dados/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Atualização automática dos resultados de loteria" && git push)
