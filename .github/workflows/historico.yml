name: 🤖 Atualizar Histórico

on:
  schedule:
    # Roda 1x/dia às 06:00 BRT (09:00 UTC)
    # Depois que o robô do último já atualizou tudo
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  atualizar-historico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Rodar robô do histórico
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/robo_historico.js

      - name: Commit dos JSONs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historico_*.json
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Atualiza históricos [skip ci]"
          git push
