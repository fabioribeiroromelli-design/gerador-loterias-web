<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Jogos - Volante</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-bar">
        <button class="btn-back" onclick="window.location.href='home.html'">←</button>
        <h1 id="page_title">Gerador de Jogos</h1>
    </header>

    <main class="container">
        <div class="volante-card">
            <div class="volante-header">
                <h2 id="volante_title">Volante de Seleção</h2>
                <div class="mode-selector">
                    <label><input type="radio" name="mode" value="fixed" checked> <span id="lbl_fixed_mode">Fixo</span></label>
                    <label><input type="radio" name="mode" value="excluded"> <span id="lbl_excluded_mode">Excluído</span></label>
                </div>
            </div>

            <div id="summary-info" class="summary-info">
                Fixos: <strong>Nenhum</strong> | Excluídos: <strong>Nenhum</strong>
            </div>

            <!-- Grade de números/colunas -->
            <div id="numbers_grid" class="numbers-grid"></div>

            <!-- Painel de Configurações e Filtros -->
            <div class="filters-panel" style="margin: 15px 0; display: flex; flex-wrap: wrap; gap: 10px;">
                <div>
                    <label for="qtd_jogos">Qtd. Jogos:</label>
                    <input type="number" id="qtd_jogos" value="1" min="1" max="50" style="width: 60px; padding: 4px;">
                </div>
                <div>
                    <label for="select_pares">Pares:</label>
                    <select id="select_pares" style="padding: 4px;"><option value="">Todos</option></select>
                </div>
                <div>
                    <label for="select_impares">Ímpares:</label>
                    <select id="select_impares" style="padding: 4px;"><option value="">Todos</option></select>
                </div>
                <div>
                    <label for="select_primos">Primos:</label>
                    <select id="select_primos" style="padding: 4px;"><option value="">Todos</option></select>
                </div>
            </div>

            <div class="actions-panel">
                <button id="btn_clear" class="btn-secondary">Limpar</button>
                <button id="btn_generate" class="btn-primary">Gerar Jogo</button>
            </div>
        </div>

        <div class="games-container">
            <h3 id="lbl_generated_title">Jogos Gerados</h3>
            <div id="generated_games_list"></div>
        </div>
    </main>

    <!-- Importação dos Scripts -->
    <script src="superSete.js"></script>
    <script src="script.js"></script>
</body>
</html>
