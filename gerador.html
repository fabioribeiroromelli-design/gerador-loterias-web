<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page_title_meta">Gerador de Jogos - Loterias</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SCRIPT OFICIAL DO GOOGLE PARA LOGIN VIA GMAIL -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* Estilos do Selo e Trava VIP nos Cards */
        .vip-card-locked {
            position: relative !important;
        }
        .vip-badge-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 4px;
            pointer-events: none;
        }

        /* Estilo do Modal/Toast VIP */
        .vip-toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            backdrop-filter: blur(3px);
        }
        .vip-toast-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 25px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <header class="toolbar" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
        <h1 id="home_title" style="margin: 0; font-size: 1.2rem;">
            <i class="fa-solid fa-dice"></i> <span id="txt_header_title">Loterias Disponíveis</span>
        </h1>

        <!-- ÁREA DE LOGIN DO USUÁRIO -->
        <div id="user_auth_area">
            <div id="g_id_onload"
                 data-client_id="383374785711-e00t37fkf9q6aqe5imqi0nnh29v2npq4.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="medium" data-locale="pt-BR"></div>
        </div>
    </header>

    <!-- BANNER DE ANÚNCIO COM QR CODE PARA DOWNLOAD DO APP -->
    <section class="app-promo-banner" style="background: linear-gradient(135deg, #0d47a1, #1976d2); color: white; padding: 15px 20px; border-radius: 10px; margin: 15px auto; max-width: 1200px; display: flex; align-items: center; justify-content: space-between; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); flex-wrap: wrap;">
        
        <div style="display: flex; align-items: center; gap: 15px; flex: 1; min-width: 280px;">
            <i class="fa-brands fa-google-play" style="font-size: 2.8rem; color: #64ffda;"></i>
            <div>
                <h2 id="txt_banner_title" style="margin: 0; font-size: 1.2rem;">Quer acesso a TODAS as loterias e estatísticas VIP?</h2>
                <p id="txt_banner_desc" style="margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.9;">
                    Baixe nosso App na Google Play Store, faça sua assinatura e use o mesmo Gmail aqui no site para liberar tudo!
                </p>
            </div>
        </div>

        <!-- ÁREA DO QR CODE E BOTÃO DA PLAY STORE -->
        <div style="display: flex; align-items: center; gap: 15px; background: rgba(255, 255, 255, 0.1); padding: 10px 15px; border-radius: 8px;">
            <div style="text-align: center;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=https://play.google.com/store/apps/details?id=com.fabioribeiroromelli.geradordejogos" alt="QR Code App" style="border-radius: 6px; background: #fff; padding: 4px; display: block;">
                <span id="txt_qr_label" style="font-size: 0.7rem; color: #64ffda; font-weight: bold; margin-top: 4px; display: block;">Aponte a câmera</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <a id="txt_btn_playstore" href="https://play.google.com/store/apps/details?id=com.fabioribeiroromelli.geradordejogos&pli=1" target="_blank" style="background-color: #00c853; color: white; padding: 10px 16px; border-radius: 6px; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; white-space: nowrap;">
                    <i class="fa-solid fa-download"></i> Baixar na Play Store
                </a>
            </div>
        </div>

    </section>

    <!-- BARRA DE ATALHOS FIXA -->
    <div class="shortcuts-bar">
        <button onclick="window.location.href='gerador.html'">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="txt_shortcut_gerar">Gerar Jogos</span>
        </button>
        <button onclick="window.location.href='saved_games.html'">
            <i class="fa-solid fa-bookmark"></i> <span id="txt_shortcut_salvos">Jogos Salvos</span>
        </button>
        <button onclick="window.location.href='download_results.html'">
            <i class="fa-solid fa-download"></i> <span id="txt_shortcut_downloads">Downloads / Resultados</span>
        </button>
        <button onclick="window.location.href='statistics.html'">
            <i class="fa-solid fa-chart-pie"></i> <span id="txt_shortcut_stats">Estatísticas</span>
        </button>
        <button onclick="window.location.href='generator.html'">
            <i class="fa-solid fa-filter"></i> <span id="txt_shortcut_filtrar">Filtrar Números</span>
        </button>
        <button onclick="window.open('https://www.youtube.com/channel/UCPbhr02AfVb2nd5pm12BxTw/live', '_blank')">
            <i class="fa-solid fa-tv"></i> <span id="txt_shortcut_aovivo">Sorteio ao Vivo</span>
        </button>
    </div>

    <main class="container">
        <div id="lottery_grid" class="lottery-grid"></div>
    </main>

    <!-- SCRIPTS PADRÃO DA SUA APLICAÇÃO -->
    <script src="dados_loteria.js"></script>
    <script src="script_home.js"></script>

    <!-- SCRIPT DE TRADUÇÃO E BLOQUEIO VIP -->
    <script>
        (function() {
            var isSubscriber = false; // Controle da assinatura

            // Traduções completas para PT, EN e ES
            var globalTranslations = {
                pt: {
                    metaTitle: "Gerador de Jogos - Loterias",
                    headerTitle: "Loterias Disponíveis",
                    bannerTitle: "Quer acesso a TODAS as loterias e estatísticas VIP?",
                    bannerDesc: "Baixe nosso App na Google Play Store, faça sua assinatura e use o mesmo Gmail aqui no site para liberar tudo!",
                    qrLabel: "Aponte a câmera",
                    btnPlay: "Baixar na Play Store",
                    sGerar: "Gerar Jogos",
                    sSalvos: "Jogos Salvos",
                    sDownloads: "Downloads / Resultados",
                    sStats: "Estatísticas",
                    sFiltrar: "Filtrar Números",
                    sAoVivo: "Sorteio ao Vivo",
                    vipModalTitle: "Função Exclusiva VIP 🔒",
                    vipModalMsg: "Esta função é exclusiva para assinantes! Baixe nosso app na Google Play, assine o plano VIP e libere todas as funções do site.",
                    vipBtnClose: "Fechar"
                },
                en: {
                    metaTitle: "Game Generator - Lotteries",
                    headerTitle: "Available Lotteries",
                    bannerTitle: "Want access to ALL lotteries and VIP statistics?",
                    bannerDesc: "Download our app on the Google Play Store, subscribe, and use the same Gmail here on the website to unlock everything!",
                    qrLabel: "Point camera",
                    btnPlay: "Get it on Play Store",
                    sGerar: "Generate Games",
                    sSalvos: "Saved Games",
                    sDownloads: "Downloads / Results",
                    sStats: "Statistics",
                    sFiltrar: "Filter Numbers",
                    sAoVivo: "Live Draw",
                    vipModalTitle: "Exclusive VIP Feature 🔒",
                    vipModalMsg: "This feature is for subscribers only! Download our app on Google Play, subscribe to the VIP plan, and unlock all tools.",
                    vipBtnClose: "Close"
                },
                es: {
                    metaTitle: "Generador de Juegos - Loterías",
                    headerTitle: "Loterías Disponibles",
                    bannerTitle: "¿Quieres acceso a TODAS las loterías y estadísticas VIP?",
                    bannerDesc: "¡Descarga nuestra app en Google Play Store, suscríbete y usa el mismo Gmail aquí en el sitio para desbloquear todo!",
                    qrLabel: "Apunta la cámara",
                    btnPlay: "Obtener en Play Store",
                    sGerar: "Generar Juegos",
                    sSalvos: "Juegos Guardados",
                    sDownloads: "Descargas / Resultados",
                    sStats: "Estadísticas",
                    sFiltrar: "Filtrar Números",
                    sAoVivo: "Sorteo en Vivo",
                    vipModalTitle: "Función Exclusiva VIP 🔒",
                    vipModalMsg: "¡Esta función es solo para suscriptores! Descarga nuestra app en Google Play, suscríbete al plan VIP y desbloquea todas las herramientas.",
                    vipBtnClose: "Cerrar"
                }
            };

            // Detecta o idioma (pt, en ou es)
            var lang = navigator.language.toLowerCase();
            var userLang = 'pt';
            if (lang.startsWith('en')) userLang = 'en';
            else if (lang.startsWith('es')) userLang = 'es';

            var t = globalTranslations[userLang];

            // Aplica as traduções nos elementos da página
            window.addEventListener('DOMContentLoaded', function() {
                document.getElementById('page_title_meta').innerText = t.metaTitle;
                document.getElementById('txt_header_title').innerText = t.headerTitle;
                document.getElementById('txt_banner_title').innerText = t.bannerTitle;
                document.getElementById('txt_banner_desc').innerText = t.bannerDesc;
                document.getElementById('txt_qr_label').innerText = t.qrLabel;
                document.getElementById('txt_btn_playstore').innerHTML = '<i class="fa-solid fa-download"></i> ' + t.btnPlay;

                document.getElementById('txt_shortcut_gerar').innerText = t.sGerar;
                document.getElementById('txt_shortcut_salvos').innerText = t.sSalvos;
                document.getElementById('txt_shortcut_downloads').innerText = t.sDownloads;
                document.getElementById('txt_shortcut_stats').innerText = t.sStats;
                document.getElementById('txt_shortcut_filtrar').innerText = t.sFiltrar;
                document.getElementById('txt_shortcut_aovivo').innerText = t.sAoVivo;

                setTimeout(aplicarTravaNosCards, 500);
            });

            // Aplica os cadeados nos 5 primeiros cards do grid
            function aplicarTravaNosCards() {
                var grid = document.getElementById('lottery_grid');
                if (!grid) return;

                var cards = grid.children;
                var maxBloqueio = Math.min(5, cards.length);

                for (var i = 0; i < maxBloqueio; i++) {
                    var card = cards[i];
                    card.classList.add('vip-card-locked');

                    if (!card.querySelector('.vip-badge-badge')) {
                        var badge = document.createElement('span');
                        badge.className = 'vip-badge-badge';
                        badge.innerHTML = '<i class="fa-solid fa-lock"></i> VIP';
                        card.appendChild(badge);
                    }
                }
            }

            // Exibe o modal de bloqueio traduzido
            function exibirModalVIP() {
                if (document.getElementById('vip-modal')) return;

                var modal = document.createElement('div');
                modal.id = 'vip-modal';
                modal.className = 'vip-toast-overlay';
                modal.innerHTML = `
                    <div class="vip-toast-box">
                        <div style="font-size: 3rem; color: #f39c12; margin-bottom: 10px;">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <h3 style="margin: 0 0 10px 0; color: #2c3e50;">${t.vipModalTitle}</h3>
                        <p style="color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 20px;">${t.vipModalMsg}</p>
                        <div style="display: flex; gap: 10px; justify-content: center;">
                            <a href="https://play.google.com/store/apps/details?id=com.fabioribeiroromelli.geradordejogos" target="_blank" style="background: #27ae60; color: white; padding: 10px 18px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 8px;">
                                <i class="fa-brands fa-google-play"></i> ${t.btnPlay}
                            </a>
                            <button id="btn-close-vip-modal" style="background: #e0e0e0; border: none; color: #333; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer;">
                                ${t.vipBtnClose}
                            </button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                document.getElementById('btn-close-vip-modal').onclick = function() {
                    modal.remove();
                };
            }

            // Intercepta cliques nos 5 primeiros cards se não for assinante
            document.addEventListener('click', function(e) {
                if (isSubscriber) return; // Se for assinante, libera tudo

                var grid = document.getElementById('lottery_grid');
                if (!grid) return;

                var cardClicado = e.target.closest('#lottery_grid > *');
                if (cardClicado) {
                    var cardsArray = Array.from(grid.children);
                    var index = cardsArray.indexOf(cardClicado);

                    // Bloqueia apenas do 1º ao 5º card (índices 0 a 4)
                    if (index >= 0 && index < 5) {
                        e.preventDefault();
                        e.stopPropagation();
                        exibirModalVIP();
                    }
                }
            }, true);
        })();
    </script>
</body>
</html>
