<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estratégias Premium - Gerador de Jogos</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #E0E0E0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-strategy { background-color: #1E1E1E; border: 1px solid #333; transition: transform 0.2s, border-color 0.2s; cursor: pointer; }
        .card-strategy:hover { transform: translateY(-4px); border-color: #00E676; }
        .card-strategy.selected { border: 2px solid #00E676; background-color: #252A25; }
        .ball { width: 38px; height: 38px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; margin: 3px; color: #FFF; }
        .bg-megasena { background-color: #209869; }
        .bg-lotofacil { background-color: #930089; }
        .bg-quina { background-color: #260085; }
        .bg-lotomania { background-color: #F78100; }
        .quick-chip { cursor: pointer; background: #2A2A2A; border: 1px solid #444; border-radius: 20px; padding: 4px 12px; }
        .quick-chip.active { background: #00E676; color: #000; font-weight: bold; }
    </style>
</head>
<body class="pb-5">

<div class="container my-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
        <h2><i class="fa-solid fa-wand-magic-sparkles text-warning me-2"></i>Estratégias Premium</h2>
        <select id="selectLottery" class="form-select bg-dark text-white border-secondary w-auto" onchange="changeLottery(this.value)">
            <option value="Mega-Sena">Mega-Sena</option>
            <option value="Lotofácil">Lotofácil</option>
            <option value="Quina">Quina</option>
            <option value="Lotomania">Lotomania</option>
            <option value="Super Sete">Super Sete</option>
        </select>
    </div>

    <!-- Cards de Estratégias -->
    <h5 class="mb-3 text-secondary">Selecione a Estratégia</h5>
    <div class="row g-3" id="strategyCardsContainer">
        <!-- Renderizado dinamicamente via Javascript -->
    </div>

    <!-- Configurações e Filtros -->
    <div class="card bg-dark border-secondary my-4">
        <div class="card-body">
            <h5 class="card-title text-warning mb-3"><i class="fa-solid fa-sliders me-2"></i>Parâmetros & Filtros</h5>
            
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Quantidade de Jogos</label>
                    <div class="d-flex align-items-center gap-2">
                        <input type="number" id="inputGameCount" class="form-control bg-secondary text-white border-0" value="1" min="1" max="50">
                    </div>
                    <div class="mt-2 d-flex gap-1 flex-wrap">
                        <span class="quick-chip active" onclick="setQuickGames(1)">1</span>
                        <span class="quick-chip" onclick="setQuickGames(3)">3</span>
                        <span class="quick-chip" onclick="setQuickGames(5)">5</span>
                        <span class="quick-chip" onclick="setQuickGames(10)">10</span>
                        <span class="quick-chip" onclick="setQuickGames(20)">20</span>
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Dezenas por Jogo</label>
                    <input type="number" id="inputNumbersPerGame" class="form-control bg-secondary text-white border-0" value="6">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Pares</label>
                    <input type="number" id="filterEven" class="form-control bg-secondary text-white border-0" placeholder="Opcional">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Ímpares</label>
                    <input type="number" id="filterOdd" class="form-control bg-secondary text-white border-0" placeholder="Opcional">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Primos</label>
                    <input type="number" id="filterPrime" class="form-control bg-secondary text-white border-0" placeholder="Opcional">
                </div>
            </div>

            <div class="text-end mt-4">
                <button id="btnGenerate" class="btn btn-success btn-lg px-5 fw-bold" onclick="generateGames()">
                    <i class="fa-solid fa-bolt me-2"></i>Gerar Jogos
                </button>
            </div>
        </div>
    </div>

    <!-- Resultados -->
    <div id="resultsSection" class="d-none">
        <h5 class="text-secondary mb-3">Jogos Gerados</h5>
        <div id="gamesOutput" class="d-flex flex-column gap-2 mb-3"></div>
        <button class="btn btn-outline-warning" onclick="saveAllGames()"><i class="fa-solid fa-bookmark me-2"></i>Salvar Jogos</button>
    </div>
</div>

<script src="premium-strategies.js"></script>
</body>
</html>
